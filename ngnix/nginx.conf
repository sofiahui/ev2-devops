# Gateway: unico punto de entrada. Balancea entre las replicas de ms-pedidos.
upstream pedidos   { server ms-pedidos:8000; }
upstream productos { server ms-productos:8081; }

server {
    listen 80;

    location /pedidos        { proxy_pass http://pedidos; }
    location /health         { proxy_pass http://pedidos/health; }
    location /api/productos  { proxy_pass http://productos; }
    location /productos/health { proxy_pass http://productos/actuator/health; }
}